[package]
name = "ds4-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.27.2"
# Library untuk membaca XInput (Virtual Xbox Controller)
rusty-xinput = "1.3.0"
# Library untuk Virtual Controller (Android Server)
vigem-client = "0.1.4"
# WAJIB: Untuk API Mouse/Keyboard di input_utils.rs
windows = { version = "0.53.0", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation"
] }

[build-dependencies]
winres = "0.1.12"